<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - ItaPets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header>
    <p><strong>ITAPETS - O Paraíso dos seus Pets</strong></p>
    <nav>
      <ul>
        <li><a href="index.html" target="_blank">INÍCIO</a></li>
        <li><a href="index.html" target="_blank">PRODUTOS</a></li>
        <li>
          <a href="index.html" target="_blank">QUEM SOMOS</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contate aqui!</h1>

      <form action="mailto:bernardonx20@gmail.com" method="POST" enctype="text/plain">
        <div class="row g-3">
          <div class="col-12">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
          </div>

          <div class="col-12">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="col-md-6">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>

          <div class="col-md-6">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
          </div>

          <div class="col-12">
            <label for="mensagem">Descreva:</label>
            <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
          </div>

          <div class="col-12">
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceito ser contatado pelo ItaPets</label>
          </div>

          <div class="col-12">
            <button type="submit">Enviar</button>
          </div>
        </div>

        <input type="hidden" name="_assunto" value="Novo comentário - Site ItaPets">
        <input type="hidden" name="_captcha" value="false">
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ItaPets. Todos os direitos reservados.</p>
  </footer>
</body>

</html>
